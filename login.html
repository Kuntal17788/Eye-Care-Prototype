<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Eye Care</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="login-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <div class="brand-name">Eye Care</div>
      <div class="brand-tag">Patient records &amp; prescriptions</div>
    </div>

    <div class="card card-pad">
      <div class="login-form">

        <div class="login-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
          Incorrect username or password
        </div>
        <div class="hint" style="margin-top:-10px;">↑ Example error state — only shown after a failed attempt, hidden otherwise.</div>

        <div class="field">
          <label>Username</label>
          <input type="text" placeholder="Enter your username">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="text" placeholder="Enter your password">
        </div>

        <a href="patients.html" class="btn btn-primary btn-block" style="margin-top:6px;">Log In</a>
      </div>
    </div>

    <div class="login-footnote">
      You'll stay logged in until you log out — no need to sign in again each time you open Eye Care.
    </div>

  </div>
</div>
</body>
</html>
