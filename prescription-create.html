<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Prescription — Eye Clinic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
  <div class="brand"><span class="ring"></span><span>Eye Clinic</span></div>
  <a class="nav-item " href="doctor-queue.html"><i class="ti ti-layout-grid"></i>Queue</a>
<a class="nav-item " href="patient-timeline.html"><i class="ti ti-timeline"></i>Timeline</a>
<a class="nav-item active" href="prescription-history.html"><i class="ti ti-file-prescription"></i>Prescriptions</a>
<a class="nav-item " href="trend-graphs.html"><i class="ti ti-chart-line"></i>Results</a>
<a class="nav-item " href="notifications.html"><i class="ti ti-bell"></i>Notifications</a>

  <div class="sidebar-footer">
    <a class="nav-item" href="index.html"><i class="ti ti-logout"></i>Sign out</a>
  </div>
</aside>
  <div class="main">
    <header class="topbar">
  <div class="search-box"><i class="ti ti-search"></i><input placeholder="Search patients, records..." onclick="location.href='search-results.html'" readonly></div>
  <div class="topbar-right">
    <div class="role-switch"><a class="active" href="doctor-queue.html">Doctor</a><a class="" href="patient-search-receptionist.html">Receptionist</a><a class="" href="audit-log.html">Admin</a></div>
    <div class="avatar">RM</div>
  </div>
</header>
    <main class="content">
      
<div class="page-head">
  <div>
    <a class="breadcrumb" href="prescription-history.html"><i class="ti ti-arrow-left"></i>Anita Sharma · Prescriptions</a>
    <h1>New prescription</h1>
  </div>
</div>
<div class="card" style="max-width:640px;">
  <div class="field">
    <label>Type</label>
    <select><option>Medication (eye drops / oral)</option><option>Spectacle / lens prescription</option></select>
  </div>
  <div class="field-row">
    <div class="field"><label>Medication</label><input value="Latanoprost 0.005%"></div>
    <div class="field"><label>Eye(s)</label><select><option>Both eyes (OU)</option><option>Right (OD)</option><option>Left (OS)</option></select></div>
  </div>
  <div class="field-row">
    <div class="field"><label>Dosage</label><input value="1 drop"></div>
    <div class="field"><label>Frequency</label><input value="Nightly"></div>
  </div>
  <div class="field"><label>Duration</label><input value="90 days, then review"></div>
  <div class="field"><label>Notes for pharmacist / patient</label><textarea rows="3" placeholder="Instructions, warnings..."></textarea></div>
  <div style="display:flex; gap:8px; justify-content:flex-end;">
    <a class="btn" href="prescription-history.html">Cancel</a>
    <a class="btn" href="pdf-export.html"><i class="ti ti-printer"></i>Print</a>
    <a class="btn btn-primary" href="prescription-history.html">Save & send</a>
  </div>
</div>

    </main>
  </div>
</div>
</body>
</html>
