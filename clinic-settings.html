<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Settings — Eye Clinic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
  <div class="brand"><span class="ring"></span><span>Eye Clinic</span></div>
  <a class="nav-item " href="audit-log.html"><i class="ti ti-list-details"></i>Audit Log</a>
<a class="nav-item " href="user-management.html"><i class="ti ti-users-group"></i>Users & Roles</a>
<a class="nav-item active" href="clinic-settings.html"><i class="ti ti-settings"></i>Clinic Settings</a>
<a class="nav-item " href="subscription-licensing.html"><i class="ti ti-credit-card"></i>Licensing</a>

  <div class="sidebar-footer">
    <a class="nav-item" href="index.html"><i class="ti ti-logout"></i>Sign out</a>
  </div>
</aside>
  <div class="main">
    <header class="topbar">
  <div class="search-box"><i class="ti ti-search"></i><input placeholder="Search patients, records..." onclick="location.href='search-results.html'" readonly></div>
  <div class="topbar-right">
    <div class="role-switch"><a class="" href="doctor-queue.html">Doctor</a><a class="" href="patient-search-receptionist.html">Receptionist</a><a class="active" href="audit-log.html">Admin</a></div>
    <div class="avatar">SR</div>
  </div>
</header>
    <main class="content">
      
<div class="page-head"><h1>Clinic settings</h1></div>
<div class="card" style="max-width:560px;">
  <div class="field"><label>Clinic name</label><input value="Sharma Eye Care Centre"></div>
  <div class="field-row">
    <div class="field"><label>Contact phone</label><input value="+91 33 4000 1122"></div>
    <div class="field"><label>Contact email</label><input value="frontdesk@sharmaeyecare.com"></div>
  </div>
  <div class="field"><label>Address</label><textarea rows="2">142 MG Road, Kolkata, West Bengal 700001</textarea></div>
  <div class="field"><label>Timezone</label><select><option>Asia/Kolkata (IST)</option></select></div>
  <hr class="divider">
  <p class="section-label">Branding</p>
  <div style="display:flex; gap:10px; margin-bottom:18px;">
    <div style="width:32px;height:32px;border-radius:8px;background:var(--accent); border:2px solid var(--text-primary);"></div>
    <div style="width:32px;height:32px;border-radius:8px;background:#5F8AD4;"></div>
    <div style="width:32px;height:32px;border-radius:8px;background:#B36FD4;"></div>
    <div style="width:32px;height:32px;border-radius:8px;background:#D48F5F;"></div>
  </div>
  <a class="btn btn-primary" href="clinic-settings.html">Save changes</a>
</div>

    </main>
  </div>
</div>
</body>
</html>
