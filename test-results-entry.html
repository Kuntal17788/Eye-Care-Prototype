<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Test Results — Eye Clinic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
  <div class="brand"><span class="ring"></span><span>Eye Clinic</span></div>
  <a class="nav-item " href="doctor-queue.html"><i class="ti ti-layout-grid"></i>Queue</a>
<a class="nav-item " href="patient-timeline.html"><i class="ti ti-timeline"></i>Timeline</a>
<a class="nav-item " href="prescription-history.html"><i class="ti ti-file-prescription"></i>Prescriptions</a>
<a class="nav-item active" href="trend-graphs.html"><i class="ti ti-chart-line"></i>Results</a>
<a class="nav-item " href="notifications.html"><i class="ti ti-bell"></i>Notifications</a>

  <div class="sidebar-footer">
    <a class="nav-item" href="index.html"><i class="ti ti-logout"></i>Sign out</a>
  </div>
</aside>
  <div class="main">
    <header class="topbar">
  <div class="search-box"><i class="ti ti-search"></i><input placeholder="Search patients, records..." onclick="location.href='search-results.html'" readonly></div>
  <div class="topbar-right">
    <div class="role-switch"><a class="active" href="doctor-queue.html">Doctor</a><a class="" href="patient-search-receptionist.html">Receptionist</a><a class="" href="audit-log.html">Admin</a></div>
    <div class="avatar">RM</div>
  </div>
</header>
    <main class="content">
      
<div class="page-head">
  <div>
    <a class="breadcrumb" href="patient-profile-doctor.html"><i class="ti ti-arrow-left"></i>Anita Sharma</a>
    <h1>Record test results</h1>
  </div>
  <a class="btn" href="trend-graphs.html"><i class="ti ti-chart-line"></i>View trends</a>
</div>
<div class="card" style="max-width:640px;">
  <h3 style="margin-bottom:14px;">Visual acuity</h3>
  <div class="field-row" style="margin-bottom:10px;">
  <div><label>Acuity — Right (OD) (e.g. 6/6)</label><input placeholder="—"></div>
  <div><label>Acuity — Left (OS) (e.g. 6/6)</label><input placeholder="—"></div>
</div>
  <hr class="divider">
  <h3 style="margin-bottom:14px;">Intraocular pressure</h3>
  <div class="field-row" style="margin-bottom:10px;">
  <div><label>IOP — Right (OD) (mmHg)</label><input placeholder="—"></div>
  <div><label>IOP — Left (OS) (mmHg)</label><input placeholder="—"></div>
</div>
  <hr class="divider">
  <h3 style="margin-bottom:14px;">Refraction</h3>
  <div class="field-row" style="margin-bottom:10px;">
    <div><label>Sphere (OD / OS)</label><input placeholder="-1.25 / -1.00"></div>
    <div><label>Cylinder (OD / OS)</label><input placeholder="-0.50 / -0.75"></div>
  </div>
  <div class="field-row" style="margin-bottom:10px;">
    <div><label>Axis (OD / OS)</label><input placeholder="90 / 85"></div>
    <div><label>Test date</label><input type="date" value="2026-09-03"></div>
  </div>
  <hr class="divider">
  <div class="field">
    <label>Notes</label>
    <textarea rows="3" placeholder="Additional observations..."></textarea>
  </div>
  <div style="display:flex; gap:8px; justify-content:flex-end;">
    <a class="btn" href="patient-profile-doctor.html">Cancel</a>
    <a class="btn btn-primary" href="trend-graphs.html">Save results</a>
  </div>
</div>

    </main>
  </div>
</div>
</body>
</html>
