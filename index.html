<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Eye Clinic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head><body>
<div class="login-wrap">
  <div class="card login-card">
    <div style="text-align:center; margin-bottom:22px;">
      <span class="ring" style="width:36px;height:36px;display:inline-block;margin-bottom:10px;"></span>
      <h1>Eye Clinic</h1>
      <p class="muted" style="margin-top:4px;">Sign in to your account</p>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="text" placeholder="you@clinic.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="••••••••••">
    </div>
    <button class="btn btn-primary btn-block" style="margin-bottom:18px;" onclick="location.href='doctor-queue.html'">Sign in</button>
    <hr class="divider">
    <p class="muted" style="text-align:center; font-size:12px; margin-bottom:12px;">Prototype shortcuts — jump straight into a role</p>
    <div style="display:flex; gap:8px;">
      <a class="btn" style="flex:1; justify-content:center;" href="doctor-queue.html"><i class="ti ti-stethoscope"></i>Doctor</a>
      <a class="btn" style="flex:1; justify-content:center;" href="patient-search-receptionist.html"><i class="ti ti-user-plus"></i>Reception</a>
      <a class="btn" style="flex:1; justify-content:center;" href="audit-log.html"><i class="ti ti-settings"></i>Admin</a>
    </div>
  </div>
</div>
</body></html>
