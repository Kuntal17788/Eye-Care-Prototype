<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Summary — Eye Clinic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
  <div class="brand"><span class="ring"></span><span>Eye Clinic</span></div>
  <a class="nav-item active" href="doctor-queue.html"><i class="ti ti-layout-grid"></i>Queue</a>
<a class="nav-item " href="patient-timeline.html"><i class="ti ti-timeline"></i>Timeline</a>
<a class="nav-item " href="prescription-history.html"><i class="ti ti-file-prescription"></i>Prescriptions</a>
<a class="nav-item " href="trend-graphs.html"><i class="ti ti-chart-line"></i>Results</a>
<a class="nav-item " href="notifications.html"><i class="ti ti-bell"></i>Notifications</a>

  <div class="sidebar-footer">
    <a class="nav-item" href="index.html"><i class="ti ti-logout"></i>Sign out</a>
  </div>
</aside>
  <div class="main">
    <header class="topbar">
  <div class="search-box"><i class="ti ti-search"></i><input placeholder="Search patients, records..." onclick="location.href='search-results.html'" readonly></div>
  <div class="topbar-right">
    <div class="role-switch"><a class="active" href="doctor-queue.html">Doctor</a><a class="" href="patient-search-receptionist.html">Receptionist</a><a class="" href="audit-log.html">Admin</a></div>
    <div class="avatar">RM</div>
  </div>
</header>
    <main class="content">
      
<div class="page-head">
  <div>
    <a class="breadcrumb" href="patient-profile-doctor.html"><i class="ti ti-arrow-left"></i>Anita Sharma</a>
    <h1>Export patient summary</h1>
  </div>
</div>
<div class="grid-2" style="grid-template-columns: 1fr 260px; align-items:start;">
  <div class="card">
    <p class="section-label">Include in summary</p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-primary);"><input type="checkbox" checked style="width:auto;"> Visit history</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-primary);"><input type="checkbox" checked style="width:auto;"> Test results & trends</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-primary);"><input type="checkbox" checked style="width:auto;"> Images (fundus, OCT, fields)</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-primary);"><input type="checkbox" style="width:auto;"> Prescriptions</label>
    </div>
    <div class="field-row">
      <div class="field"><label>From</label><input type="date" value="2026-03-14"></div>
      <div class="field"><label>To</label><input type="date" value="2026-09-03"></div>
    </div>
    <div class="field">
      <label>Purpose</label>
      <select><option>Referral</option><option>Insurance claim</option><option>Patient request</option></select>
    </div>
    <a class="btn btn-primary btn-block" href="pdf-export.html"><i class="ti ti-file-download"></i>Generate PDF</a>
  </div>
  <div>
    <p class="section-label">Preview</p>
    <div class="card" style="aspect-ratio: 0.77; background:var(--surface-1); display:flex; flex-direction:column; gap:8px; padding:16px;">
      <div class="skeleton" style="height:14px; width:60%;"></div>
      <div class="skeleton" style="height:8px; width:90%;"></div>
      <div class="skeleton" style="height:8px; width:80%;"></div>
      <div class="skeleton" style="height:60px; width:100%; margin-top:8px;"></div>
      <div class="skeleton" style="height:8px; width:70%;"></div>
      <div class="skeleton" style="height:8px; width:85%;"></div>
    </div>
  </div>
</div>

    </main>
  </div>
</div>
</body>
</html>
